<!DOCTYPE html>

<title>Sketchfab VR Viewer (Scene Movement Option)</title>
<script src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>
<style>
body { margin: 0; font-family: sans-serif; background: #111; color: #eee; }
#controls { padding: 8px; background: #222; }
#controls input { width: 60%; padding: 4px; }
iframe { width: 100vw; height: 90vh; border: none; }
.delay-btn {
  background: #444;
  color: #fff;
  border: 1px solid #666;
  padding: 6px 12px;
  margin: 4px;
  cursor: pointer;
}
.delay-btn.pressed {
  background: #28a745; /* green */
  border-color: #1e7e34;
}
iframe {
  width: 80%;       /* iframe is 80% of the viewport width */
  height: 50vh;     /* still tall, full height minus controls */

  margin: 0 10%;    /* 10% margin left and right */
}
/* slider */
.slider-container {
  display: flex;
  align-items: center;
  gap: 10px;
}
.slider-container input[type="range"] {
  flex: 1;
}
/* toggle button */
.toggle-btn {
  background: #444;
  color: #fff;
  border: 1px solid #666;
  padding: 6px 12px;
  cursor: pointer;
  border-radius: 4px;
}
.toggle-btn.active {
  background: #28a745; /* green */
  border-color: #1e7e34;
}
</style>
</head>
